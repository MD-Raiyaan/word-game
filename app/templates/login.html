{% extends "base.html" %}

{% block title %}Login - Guess the Word{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to play or access administrative reports</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username or '' }}"
                required
                placeholder="Enter username"
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Enter password"
            >
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>
</div>
{% endblock %}
